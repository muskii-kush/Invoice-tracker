<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Status Board</title>
<style>
:root {
  --blue:#4736FE; --blue-dark:#2B2098; --blue-light:#E3E1FF;
  --mint:#63FFB1; --mint-dark:#20E2BF; --mint-soft:#E9FCF9;
  --orange:#FF4F01; --black:#020618; --white:#FFFFFF;
  --grey-50:#F5F7FB; --grey-100:#EAECF2; --grey-200:#D4D9E8;
  --grey-500:#7B83A0; --grey-700:#3D4260;
  --ink:#1A2238; --sub:#4D5876; --mut:#8390AA;
  --green:#00B37E; --amber:#D97706; --red:#DC2626;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Arial,sans-serif;background:var(--grey-50);color:var(--ink);line-height:1.5;font-size:14px;}
a{color:var(--blue);}

/* HEADER */
.main-header{background:linear-gradient(140deg,#080524 0%,#1a0e7a 45%,#3326c8 100%);padding:36px 40px 28px;color:#fff;}
.header-eyebrow{font-size:12px;color:rgba(255,255,255,.5);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.header-title{font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1.1;}
.header-title .hi{color:var(--mint);}
.header-meta{margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.55);}
.header-meta b{color:rgba(255,255,255,.9);}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:14px;overflow:hidden;margin-top:22px;}
.stat-box{background:rgba(255,255,255,.04);padding:16px 20px;}
.stat-box .sv{font-size:24px;font-weight:900;color:var(--mint);letter-spacing:-.02em;}
.stat-box .sl{font-size:11px;color:rgba(255,255,255,.6);margin-top:4px;}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr);}}

/* TABS */
.tab-bar{position:sticky;top:0;z-index:110;background:#0d0830;display:flex;gap:0;padding:0 28px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.tab-btn{background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,.55);font-family:inherit;font-size:13.5px;font-weight:800;letter-spacing:.02em;padding:15px 22px;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{color:rgba(255,255,255,.85);}
.tab-btn.active{color:#fff;border-bottom-color:var(--mint);background:rgba(255,255,255,.04);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.content{max-width:1400px;margin:0 auto;padding:26px 28px 70px;}

/* CONTROLS */
.controls-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.search-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--grey-200);border-radius:12px;padding:10px 16px;flex:1;min-width:240px;max-width:420px;}
.search-bar input{border:none;outline:none;font-size:13.5px;width:100%;background:transparent;color:var(--ink);font-family:inherit;}
.filter-chip{padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid var(--grey-200);background:#fff;color:var(--sub);cursor:pointer;white-space:nowrap;}
.filter-chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.count-note{font-size:12px;color:var(--mut);margin-bottom:12px;font-weight:600;}

/* TABLE */
.matrix-wrap{overflow-x:auto;background:#fff;border:1px solid var(--grey-200);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:28px;}
table.matrix{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px;}
table.matrix th{background:var(--grey-50);text-align:left;padding:12px 16px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);border-bottom:2px solid var(--grey-200);white-space:nowrap;}
table.matrix td{padding:12px 16px;border-bottom:1px solid var(--grey-100);color:var(--ink);line-height:1.5;vertical-align:top;}
table.matrix tr:last-child td{border-bottom:none;}
table.matrix tr:hover{background:var(--grey-50);}
table.matrix td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700;}
table.matrix td.nowrap{white-space:nowrap;}
.cell-truncate{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px;}
.empty-note{padding:50px 20px;text-align:center;color:var(--mut);font-size:13.5px;}
.vendor-name{font-weight:800;}
.reason-text{color:var(--sub);}
.reason-text.muted{color:var(--mut);font-style:italic;}
.next-step{color:var(--blue-dark);font-weight:600;}

/* STATUS PILLS */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.01em;white-space:nowrap;}

.footer{text-align:center;padding:26px;color:var(--mut);font-size:11.5px;border-top:1px solid var(--grey-200);margin-top:16px;}
</style>
</head>
<body>

<header class="main-header">
  <div class="header-eyebrow">CARS24 — Technology Vendor Invoices</div>
  <div class="header-title">Invoice <span class="hi">Status Board</span></div>
  <div class="header-meta">Updated <b id="metaGeneratedAt">—</b> &nbsp;·&nbsp; Source: Gmail automated intake</div>
  <div class="stats-grid" id="statsGrid"></div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" onclick="showTab('board', event)">📋 Status Board</button>
  <button class="tab-btn" onclick="showTab('details', event)">🔍 Full Details</button>
</div>

<div class="content">

  <!-- STATUS BOARD -->
  <div id="panel-board" class="tab-panel active">
    <div class="controls-row">
      <div class="search-bar">
        <span style="color:var(--blue);font-weight:800;">⌕</span>
        <input type="text" id="searchBoard" placeholder="Search vendor, invoice number...">
      </div>
      <button class="filter-chip active" id="filterAll" onclick="setFilter('all')">All</button>
      <button class="filter-chip" id="filterAttention" onclick="setFilter('attention')">⚠ Needs Attention</button>
      <button class="filter-chip" id="filterPaid" onclick="setFilter('paid')">✓ Paid</button>
    </div>
    <div class="count-note" id="countBoard"></div>
    <div class="matrix-wrap"><div id="tableBoard"></div></div>
  </div>

  <!-- FULL DETAILS -->
  <div id="panel-details" class="tab-panel">
    <div class="controls-row">
      <div class="search-bar">
        <span style="color:var(--blue);font-weight:800;">⌕</span>
        <input type="text" id="searchDetails" placeholder="Search any field...">
      </div>
    </div>
    <div class="count-note" id="countDetails"></div>
    <div class="matrix-wrap"><div id="tableDetails"></div></div>
  </div>

</div>

<div class="footer">Invoice Status Board &nbsp;·&nbsp; CARS24 Tech &amp; AI Strategy &nbsp;·&nbsp; Auto-generated from the live tracker sheet</div>

<script>
const DATA = <?!= dataJson ?>;

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function showTab(name, evt) {
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('panel-' + name).classList.add('active');
  if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================= plain-English status derivation ================= */
// Ordered worst-first so sorting by rank surfaces problems before "Paid".
const STATUS_RULES = [
  { test: r => r['P2P Status'] === 'Rejected', label: 'Rejected', color: { bg: '#FDE2E7', fg: '#9F1239' } },
  { test: r => r['P2P Status'] === 'Validation issue', label: 'Blocked — Validation Issue', color: { bg: '#FDE2E7', fg: '#9F1239' } },
  { test: r => ['Needs review', 'Missing information'].indexOf(r['Intake Status']) !== -1, label: 'Needs Info', color: { bg: '#FEF3C7', fg: '#92400E' } },
  { test: r => r['P2P Status'] === 'Approval pending', label: 'Awaiting Approval', color: { bg: '#FEF3C7', fg: '#92400E' } },
  { test: r => ['Submitted to P2P', 'Approved', 'Processed'].indexOf(r['P2P Status']) !== -1, label: 'In Process', color: { bg: '#E3E1FF', fg: '#2B2098' } },
  { test: r => r['Intake Status'] === 'Confirmed invoice' && r['P2P Status'] === 'Not submitted', label: 'Ready — Not Yet Submitted', color: { bg: '#E3E1FF', fg: '#2B2098' } },
  { test: r => r['P2P Status'] === 'Paid', label: 'Paid', color: { bg: '#D1FAE5', fg: '#065F46' } },
  { test: r => ['Not an invoice', 'Duplicate'].indexOf(r['Intake Status']) !== -1, label: 'Not Applicable', color: { bg: '#EAECF2', fg: '#3D4260' } },
];
const SUGGESTED_NEXT_STEP = {
  'Rejected': 'Review rejection reason with vendor/finance, resubmit or close out',
  'Blocked — Validation Issue': 'Resolve the validation issue (GST/amount/PO mismatch) with finance',
  'Needs Info': 'Open the source email and fill in the missing invoice number/amount',
  'Awaiting Approval': 'Follow up with the approver',
  'In Process': 'No action — tracking through P2P',
  'Ready — Not Yet Submitted': 'Submit to P2P/Aerchain',
  'Paid': 'None — closed',
  'Not Applicable': '—',
};
function computeStatus(row) {
  for (var i = 0; i < STATUS_RULES.length; i++) {
    if (STATUS_RULES[i].test(row)) return { label: STATUS_RULES[i].label, color: STATUS_RULES[i].color, rank: i };
  }
  return { label: row['Intake Status'] || 'Unknown', color: { bg: '#EAECF2', fg: '#3D4260' }, rank: STATUS_RULES.length };
}
function statusPill(status) {
  return '<span class="pill" style="background:' + status.color.bg + ';color:' + status.color.fg + ';">' + esc(status.label) + '</span>';
}

/* Latest Activity Log entry per Invoice ID — this is "what happened on the thread" */
function buildLatestActivityMap(activityLog) {
  const map = {};
  activityLog.forEach(function(a) {
    const id = a['Invoice ID'];
    if (!id) return;
    const existing = map[id];
    if (!existing || String(a['Activity Date'] || '') >= String(existing['Activity Date'] || '')) {
      map[id] = a;
    }
  });
  return map;
}
const LATEST_ACTIVITY = buildLatestActivityMap(DATA.activityLog || []);

function reasonFor(row) {
  const activity = LATEST_ACTIVITY[row['Invoice ID']];
  if (activity && activity['Details']) return { text: activity['Details'], muted: false };
  if (row['Current Issue']) return { text: row['Current Issue'], muted: false };
  if (row['Remarks']) return { text: row['Remarks'], muted: false };
  return { text: 'No updates logged yet', muted: true };
}
function nextStepFor(row, status) {
  if (row['Next Action']) return row['Next Action'];
  return SUGGESTED_NEXT_STEP[status.label] || '—';
}

/* ================= enrich every invoice once ================= */
const BOARD_ROWS = (DATA.invoiceRegister || []).map(function(row) {
  const status = computeStatus(row);
  const reason = reasonFor(row);
  return {
    row: row,
    vendor: row['Vendor'] || '(Unknown vendor)',
    invoiceNumber: row['Invoice Number'] || row['PO Number'] || row['PR Number'] || '(no reference)',
    amount: row['Invoice Amount'],
    currency: row['Currency'] || '',
    status: status,
    reasonText: reason.text,
    reasonMuted: reason.muted,
    nextStep: nextStepFor(row, status),
    updated: row['Last Updated Date'] || row['Created Date'] || '',
    sourceLink: row['Source Message Link'] || '',
  };
});

/* ================= stats header ================= */
function renderStats() {
  const total = BOARD_ROWS.length;
  const paid = BOARD_ROWS.filter(function(r){ return r.status.label === 'Paid'; }).length;
  const attention = BOARD_ROWS.filter(function(r){ return r.status.rank <= 3; }).length;
  const outstanding = BOARD_ROWS
    .filter(function(r){ return r.status.label !== 'Paid' && r.status.label !== 'Not Applicable'; })
    .reduce(function(sum, r){ return sum + (typeof r.amount === 'number' ? r.amount : 0); }, 0);

  const stats = [
    [total, 'Total invoices'],
    [paid, 'Paid'],
    [attention, 'Needs attention'],
    ['₹' + Math.round(outstanding).toLocaleString('en-IN'), 'Outstanding amount'],
  ];
  document.getElementById('statsGrid').innerHTML = stats.map(function(s) {
    return '<div class="stat-box"><div class="sv">' + s[0] + '</div><div class="sl">' + s[1] + '</div></div>';
  }).join('');
  document.getElementById('metaGeneratedAt').textContent = DATA.generatedAt;
}

/* ================= Status Board tab ================= */
let currentFilter = 'all';
function setFilter(f) {
  currentFilter = f;
  ['All', 'Attention', 'Paid'].forEach(function(name) {
    document.getElementById('filter' + name).classList.toggle('active', name.toLowerCase() === f);
  });
  renderBoard();
}
function boardMatchesSearch(item, q) {
  if (!q) return true;
  const hay = (item.vendor + ' ' + item.invoiceNumber + ' ' + item.reasonText).toLowerCase();
  return hay.indexOf(q) !== -1;
}
function renderBoard() {
  const q = document.getElementById('searchBoard').value.trim().toLowerCase();
  let items = BOARD_ROWS.filter(function(item) { return boardMatchesSearch(item, q); });
  if (currentFilter === 'attention') items = items.filter(function(i){ return i.status.rank <= 3; });
  if (currentFilter === 'paid') items = items.filter(function(i){ return i.status.label === 'Paid'; });

  items = items.slice().sort(function(a, b) {
    if (a.status.rank !== b.status.rank) return a.status.rank - b.status.rank;
    return (Number(b.amount) || 0) - (Number(a.amount) || 0);
  });

  document.getElementById('countBoard').textContent = 'Showing ' + items.length + ' of ' + BOARD_ROWS.length + ' invoices';

  if (!items.length) {
    document.getElementById('tableBoard').innerHTML = '<div class="empty-note">Nothing matches.</div>';
    return;
  }

  let html = '<table class="matrix"><tr>'
    + '<th>Vendor</th><th>Invoice / Ref</th><th>Amount</th><th>Status</th>'
    + "<th>What's Happening</th><th>Next Step</th><th>Updated</th></tr>";
  items.forEach(function(item) {
    const amountText = typeof item.amount === 'number'
      ? item.currency + ' ' + item.amount.toLocaleString('en-IN', { maximumFractionDigits: 2 })
      : '';
    html += '<tr>'
      + '<td class="vendor-name nowrap">' + esc(item.vendor) + '</td>'
      + '<td class="nowrap">' + esc(item.invoiceNumber) + '</td>'
      + '<td class="num">' + esc(amountText) + '</td>'
      + '<td>' + statusPill(item.status) + '</td>'
      + '<td><span class="reason-text' + (item.reasonMuted ? ' muted' : '') + ' cell-truncate" title="' + esc(item.reasonText) + '">' + esc(item.reasonText) + '</span></td>'
      + '<td class="next-step">' + esc(item.nextStep) + '</td>'
      + '<td class="nowrap">' + esc(item.updated) + '</td>'
      + '</tr>';
  });
  html += '</table>';
  document.getElementById('tableBoard').innerHTML = html;
}

/* ================= Full Details tab ================= */
const DETAIL_COLUMNS = [
  'Invoice ID', 'Vendor', 'Service', 'Business Unit', 'Invoice Number', 'Invoice Date',
  'Invoice Amount', 'Currency', 'Due Date', 'PO Number', 'PR Number', 'P2P / Aerchain Link',
  'Vendor SPOC', 'Intake Status', 'P2P Status', 'Current Issue', 'Source Message Link', 'Remarks',
];
function detailsMatchesSearch(row, q) {
  if (!q) return true;
  return DETAIL_COLUMNS.some(function(c) { return String(row[c] || '').toLowerCase().indexOf(q) !== -1; });
}
function renderDetails() {
  const q = document.getElementById('searchDetails').value.trim().toLowerCase();
  const rows = (DATA.invoiceRegister || []).filter(function(r) { return detailsMatchesSearch(r, q); });
  document.getElementById('countDetails').textContent = 'Showing ' + rows.length + ' of ' + (DATA.invoiceRegister || []).length + ' invoices';

  if (!rows.length) {
    document.getElementById('tableDetails').innerHTML = '<div class="empty-note">Nothing matches.</div>';
    return;
  }
  let html = '<table class="matrix"><tr>' + DETAIL_COLUMNS.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
  rows.forEach(function(row) {
    html += '<tr>' + DETAIL_COLUMNS.map(function(c) {
      const v = row[c];
      if (c === 'Source Message Link' || c === 'P2P / Aerchain Link') {
        return '<td>' + (v ? '<a href="' + esc(v) + '" target="_blank" rel="noopener">Open ↗</a>' : '') + '</td>';
      }
      if (c === 'Invoice Amount' && typeof v === 'number') {
        return '<td class="num">' + v.toLocaleString('en-IN', { maximumFractionDigits: 2 }) + '</td>';
      }
      return '<td><span class="cell-truncate" title="' + esc(v) + '">' + esc(v) + '</span></td>';
    }).join('') + '</tr>';
  });
  html += '</table>';
  document.getElementById('tableDetails').innerHTML = html;
}

document.getElementById('searchBoard').addEventListener('input', renderBoard);
document.getElementById('searchDetails').addEventListener('input', renderDetails);

renderStats();
renderBoard();
renderDetails();
</script>

</body>
</html>
